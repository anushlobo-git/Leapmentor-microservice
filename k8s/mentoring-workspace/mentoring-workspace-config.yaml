apiVersion: v1
kind: ConfigMap
metadata:
  name: mentoring-workspace-config
data:
  NODE_ENV: production
  PORT: "5003"
  MONGO_URI: mongodb://mongo-0.mongo.leapmentor.svc.cluster.local:27017/leapmentor_shared?replicaSet=rs0
  MONGO_SERVER_SELECTION_TIMEOUT_MS: "5000"
  REDIS_URL: redis://redis:6379
  REDIS_ENABLED: "true"
  NOTIFICATION_STREAM_NAME: leapmentor.notifications
  CLIENT_URL: http://localhost:8080
  NOTIFICATIONS_SERVICE_URL: http://notifications-support:5005
  INTERNAL_REQUEST_TIMEOUT_MS: "3000"
  IDENTITY_SERVICE_URL: http://identity-access:5001
  PAYMENTS_SERVICE_URL: http://payments:5004
  PROFILE_SERVICE_URL: http://profile-discovery:5002
