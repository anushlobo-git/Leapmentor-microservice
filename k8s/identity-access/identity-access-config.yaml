apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-access-config
data:
  NODE_ENV: development
  PORT: "5001"
  MONGO_URI: mongodb://mongo-0.mongo.leapmentor.svc.cluster.local:27017/leapmentor_shared?replicaSet=rs0
  MONGO_SERVER_SELECTION_TIMEOUT_MS: "5000"
  REDIS_URL: redis://redis:6379
  PAYMENTS_SERVICE_URL: http://payments:5004
  INTERNAL_HTTP_TIMEOUT_MS: "3000"
  CLIENT_URL: http://localhost:8080
  APP_BASE_URL: http://localhost:8080
  LINKEDIN_CALLBACK_URL: http://localhost:8080/api/v1/auth/linkedin/callback
