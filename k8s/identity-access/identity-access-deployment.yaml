apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-access
  labels:
    app.kubernetes.io/name: identity-access
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-access
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-access
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: identity-access
          image: leapmentor-local-identity-access:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
          envFrom:
            - configMapRef:
                name: identity-access-config
            - secretRef:
                name: identity-access-secrets
            - secretRef:
                name: identity-access-smtp
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
