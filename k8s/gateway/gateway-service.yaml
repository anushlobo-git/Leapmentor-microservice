apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: leapmentor
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
spec:
  # The gateway is reached through the Ingress. Do not expose a second public
  # entry point that can bypass Ingress policies and TLS.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
