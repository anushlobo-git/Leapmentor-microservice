apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: leapmentor
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events {
        worker_connections 1024;
    }

    http {
        access_log /dev/stdout;
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        resolver 10.96.0.10 valid=10s ipv6=off;

        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            "" close;
        }

        upstream identity_access {
            server identity-access:5001;
        }

        upstream profile_discovery {
            server profile-discovery:5002;
        }

        upstream mentoring_workspace {
            server mentoring-workspace:5003;
        }

        upstream payments {
            server payments:5004;
        }

        upstream notifications_support {
            server notifications-support:5005;
        }

        upstream admin_moderation {
            server admin-moderation:5006;
        }

        upstream frontend {
            server frontend:8080;
        }

        map "$request_method:$uri" $leap_request_upstream {
            "POST:/api/v1/leap-requests" payments;
            "GET:/api/v1/leap-requests/my-request" payments;
            default admin_moderation;
        }

        server {
            listen 8080;
            server_name _;
            client_max_body_size 12m;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            location = /health/live {
                add_header Content-Type text/plain;
                return 200 "ok\n";
            }

            location = /api/v1 {
                return 404;
            }

            location ^~ /api/v1/leap-requests {
                proxy_pass http://$leap_request_upstream;
            }

            location ^~ /api/v1/admin/ {
                proxy_pass http://admin_moderation;
            }

            location ^~ /api/v1/admin {
                proxy_pass http://admin_moderation;
            }

            location ^~ /api/v1/auth/ {
                proxy_pass http://identity_access;
            }

            location ^~ /api/v1/auth {
                proxy_pass http://identity_access;
            }

            location ^~ /api/v1/verification {
                proxy_pass http://identity_access;
            }

            location ^~ /api/v1/users {
                proxy_pass http://identity_access;
            }

            location ^~ /api/v1/mentor-profile {
                proxy_pass http://profile_discovery;
            }

            location ^~ /api/v1/mentee-profile {
                proxy_pass http://profile_discovery;
            }

            location ^~ /api/v1/availability {
                proxy_pass http://profile_discovery;
            }

            location ^~ /api/v1/mentors {
                proxy_pass http://profile_discovery;
            }

            location ^~ /api/v1/upload {
                proxy_pass http://profile_discovery;
            }

            location ^~ /api/v1/google-calendar {
                proxy_pass http://profile_discovery;
            }

            location ^~ /api/v1/connect-requests {
                proxy_pass http://mentoring_workspace;
            }

            location ^~ /api/v1/slot-locks {
                proxy_pass http://mentoring_workspace;
            }

            location ^~ /api/v1/sessions {
                proxy_pass http://mentoring_workspace;
                proxy_read_timeout 120s;
            }

            location ^~ /api/v1/messages {
                proxy_pass http://mentoring_workspace;
            }

            location ^~ /api/v1/goals {
                proxy_pass http://mentoring_workspace;
            }

            location ^~ /api/v1/feedback {
                proxy_pass http://mentoring_workspace;
            }

            location ^~ /api/v1/reports {
                proxy_pass http://mentoring_workspace;
            }

            location ^~ /api/v1/private-notes {
                proxy_pass http://mentoring_workspace;
            }

            location ^~ /api/v1/notes {
                proxy_pass http://mentoring_workspace;
            }

            location ^~ /api/v1/mentor/earnings {
                proxy_pass http://payments;
            }

            location ^~ /api/v1/escrow {
                proxy_pass http://payments;
            }

            location ^~ /api/v1/invoices {
                proxy_pass http://payments;
            }

            location ^~ /api/v1/notifications {
                proxy_pass http://notifications_support;
            }

            location ^~ /api/v1/support {
                proxy_pass http://notifications_support;
            }

            location ^~ /api/v1/ai {
                proxy_pass http://notifications_support;
            }

            location ^~ /socket.io/ {
                proxy_pass http://mentoring_workspace;
                proxy_read_timeout 3600s;
            }

            location ^~ /api/ {
                return 404;
            }

            # Internal service proxy paths are deliberately not exposed through
            # the public gateway. Service-to-service traffic uses ClusterIP DNS.
            location = /services {
                return 404;
            }

            location ^~ /services/ {
                return 404;
            }

            location / {
                proxy_pass http://frontend;
            }
        }
    }
