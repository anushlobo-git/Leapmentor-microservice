apiVersion: v1
kind: ConfigMap
metadata:
  name: profile-discovery-config
data:
  NODE_ENV: production
  PORT: "5002"
  MONGO_URI: mongodb://mongo-0.mongo.leapmentor.svc.cluster.local:27017/leapmentor_shared?replicaSet=rs0
  MONGO_SERVER_SELECTION_TIMEOUT_MS: "5000"
  REDIS_URL: redis://redis:6379
  IDENTITY_SERVICE_URL: http://identity-access:5001
  WORKSPACE_SERVICE_URL: http://mentoring-workspace:5003
  INTERNAL_HTTP_TIMEOUT_MS: "3000"
  GOOGLE_REDIRECT_URI: http://localhost:8080/api/v1/google-calendar/callback
